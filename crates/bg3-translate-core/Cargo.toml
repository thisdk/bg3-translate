[package]
name = "bg3-translate-core"
description = "BG3 MOD 汉化工具的核心逻辑：PAK 解包/打包、XML/LSX/LOCA 互转、术语表匹配、LLM 翻译引擎"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
regex.workspace = true
aho-corasick.workspace = true
quick-xml.workspace = true
zip.workspace = true
bg3rustpaklib.workspace = true
# 仅类型：OpenAI 兼容协议的请求/流式响应结构（见 workspace 里的注释）
async-openai.workspace = true
tokio.workspace = true
futures-util.workspace = true
directories.workspace = true

# TLS 后端按平台选择：
# - Windows（唯一发布平台）：走系统 schannel（native-tls），不需要 CMake/NASM，
#   也不编译 aws-lc-rs，Windows 构建更快更稳
# - 其他平台：走 rustls，避免依赖系统 OpenSSL（本地开发/测试可直接编译）
#
# 注意 reqwest 0.13 里 `default-tls = ["rustls"]`（不是 native-tls），
# 所以 Windows 分支必须显式关掉默认特性再打开 native-tls。
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "http2",
    "charset",
    "native-tls",
] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "http2",
    "charset",
    "rustls",
] }

[dev-dependencies]
tempfile.workspace = true
bg3rustpaklib.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
