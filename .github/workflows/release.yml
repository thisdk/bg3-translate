name: 构建与发布（Windows x64）

# 触发方式：
#   1. push tag `v*`            → 构建 + 创建/更新 GitHub Release
#   2. workflow_dispatch        → 只构建并把安装包/便携版上传到 Actions 制品
#                                  填了 tag_name 则同时创建 Release
#
# 只出 Windows x64 产物：这个工具的使用场景就是「在 Windows 上翻译 MOD，
# 然后在 Windows 上玩游戏」，没有跨平台打包的必要。
#
# 发布标签的两道校验：
#   * 版本一致（build-windows，构建前）——标签必须等于 v + tauri.conf.json 的版本
#   * 标签冲突（publish，发布前）——标签不存在则在本次构建的提交上创建；
#     已存在但指向别的提交则直接失败，绝不把非该标签的产物挂上去
#
# 标签语义：RELEASE_TAG 非空 = 要发布；为空（dispatch 且没填 tag_name）= 只构建。
# 这样 dispatch 一个不以 v 开头的分支名时不会误触发版本校验。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布标签，例如 v1.0.0；留空则只构建并上传制品，不创建 Release"
        required: false
        type: string

# 默认只读；写权限只给真正需要创建 Release 的 publish job
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # push tag → 标签名；workflow_dispatch → 填写的 tag_name（留空即空字符串）
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}

jobs:
  build-windows:
    name: 构建 Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: 安装前端依赖
        run: bun install --frozen-lockfile

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $version"

      - name: 发布意图
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            Write-Host "RELEASE_TAG 为空：只构建并上传 Actions 制品，不创建 Release。"
          } else {
            Write-Host "RELEASE_TAG = $env:RELEASE_TAG（构建后还会再校验标签与版本/提交是否匹配）"
          }

      - name: 校验发布标签与应用版本一致
        # 只在真的要发布时校验：push tag 或 dispatch 填了 tag_name（RELEASE_TAG 非空）
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $expected = "v$env:APP_VERSION"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "标签 $env:RELEASE_TAG 与 tauri.conf.json 的版本 $env:APP_VERSION 不一致（应为 $expected，标签必须以 v 开头）。请先同步三处版本号再打标签。"
          }
          Write-Host "标签与版本一致: $env:RELEASE_TAG"

      - name: 构建应用（MSI + NSIS + 便携 exe）
        run: bun tauri build

      - name: 整理发布文件
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = "Stop"
          $out = "release-bundles"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # workspace 布局下 target 在仓库根目录；兼容历史上 src-tauri/target
          $roots = @("target", "src-tauri/target") | Where-Object { Test-Path $_ }
          if (-not $roots) { throw "找不到 cargo target 目录，构建可能失败了。" }

          $exe = $null
          $installers = @()
          foreach ($root in $roots) {
            if (-not $exe) {
              $candidate = Join-Path $root "release/bg3-translate.exe"
              if (Test-Path $candidate) { $exe = $candidate }
            }
            $installers += Get-ChildItem -Path (Join-Path $root "release/bundle/msi") -Filter *.msi -File -ErrorAction SilentlyContinue
            $installers += Get-ChildItem -Path (Join-Path $root "release/bundle/nsis") -Filter *.exe -File -ErrorAction SilentlyContinue
          }

          if (-not $exe) { throw "没找到 bg3-translate.exe，构建可能失败了。" }

          $prefix = "BG3-Translate-$env:APP_VERSION-Windows-x64"

          # 便携版
          $portable = Join-Path $out "$prefix-Portable.zip"
          Compress-Archive -Path $exe -DestinationPath $portable -Force
          Write-Host "便携版: $portable"

          foreach ($file in $installers) {
            $kind = if ($file.Extension -eq ".msi") { "Installer.msi" } else { "Setup.exe" }
            $target = Join-Path $out "$prefix-$kind"
            Copy-Item $file.FullName -Destination $target
            Write-Host "安装包: $target"
          }

          # 校验和，方便用户核对下载完整性
          $sums = Join-Path $out "SHA256SUMS.txt"
          Get-ChildItem -Path $out -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content -Path $sums -Encoding utf8
          Write-Host "校验和: $sums"

          $count = (Get-ChildItem -Path $out -File).Count
          Write-Host "共整理出 $count 个发布文件："
          Get-ChildItem -Path $out -File | ForEach-Object { Write-Host "  - $($_.Name)" }

          # 逐类校验，而不是只看文件总数：少一个安装包时总数仍然是 3，
          # 只数个数会把「MSI 没打出来」这种问题放过去。
          $names = Get-ChildItem -Path $out -File | ForEach-Object { $_.Name }
          $required = @{
            "便携版 zip" = @($names | Where-Object { $_ -like "*-Portable.zip" }).Count
            "MSI 安装包" = @($names | Where-Object { $_ -like "*.msi" }).Count
            "NSIS 安装程序" = @($names | Where-Object { $_ -like "*-Setup.exe" }).Count
            "校验和文件" = @($names | Where-Object { $_ -eq "SHA256SUMS.txt" }).Count
          }
          $missingKinds = @()
          foreach ($kind in $required.Keys) {
            if ($required[$kind] -lt 1) { $missingKinds += $kind }
          }
          if ($missingKinds.Count -gt 0) {
            throw "缺少发布产物：$($missingKinds -join '、')。tauri.conf.json 的 bundle.targets 应同时产出 nsis 与 msi。"
          }
          Write-Host "四类产物齐全：便携版 zip / MSI / NSIS / SHA256SUMS"

          # 再兜一道：Compress-Archive / Copy-Item 半途失败会留下 0 字节文件，
          # 上面只按文件名判断，这里按体积判断，避免把空壳产物发出去。
          $empty = @(Get-ChildItem -Path $out -File | Where-Object { $_.Length -eq 0 })
          if ($empty.Count -gt 0) {
            throw "存在 0 字节产物：$($empty.Name -join '、')"
          }
          Get-ChildItem -Path $out -File | ForEach-Object { Write-Host ("  {0,-56} {1,10:N0} 字节" -f $_.Name, $_.Length) }

      - name: 上传构建制品
        uses: actions/upload-artifact@v7
        with:
          name: BG3-Translate-Windows-x64
          path: release-bundles/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 发布到 GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    timeout-minutes: 15
    # 只有这个 job 需要写权限（创建/更新 Release）；其余 job 继承 workflow 级的只读
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') }}
    steps:
      - name: 下载构建制品
        uses: actions/download-artifact@v8
        with:
          name: BG3-Translate-Windows-x64
          path: release-assets

      - name: 列出待发布文件
        run: |
          set -euo pipefail
          find release-assets -type f -printf '%s\t%p\n' | sort -k2

      # 标签冲突校验（发布前的最后一道闸）：
      #   * 标签不存在 → 放行，下面会把它创建在本次构建的提交上
      #   * 标签存在且指向本次构建的提交 → 放行（重建 Release 的常见场景）
      #   * 标签存在但指向别的提交 → 失败，绝不把别的提交的产物挂到这个标签上
      # 若要把「失败」提前到构建之前，可以把这段搬到 build-windows（pwsh +
      # Invoke-WebRequest -SkipHttpErrorCheck），代价是要在 Windows 上多写一段网络代码。
      - name: 校验发布标签（存在性与冲突）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:?RELEASE_TAG 为空，不应该走到发布 job}"
          sha="$GITHUB_SHA"
          echo "标签：$tag"
          echo "本次构建提交：$sha"
          code=$(curl -sS -o /tmp/tag_commit.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$tag")
          case "$code" in
          200)
            remote=$(python3 -c 'import json;print(json.load(open("/tmp/tag_commit.json"))["sha"])')
            if [ "$remote" != "$sha" ]; then
              echo "::error::标签 $tag 已存在，但指向 $remote，与本次构建提交 $sha 不一致。请删除该标签，或从标签所在提交重新触发本工作流。"
              exit 1
            fi
            echo "标签已存在且指向本次构建提交：按「更新既有 Release」处理"
            ;;
          404)
            echo "标签不存在：发布时会创建在本次构建的提交 $sha 上"
            ;;
          *)
            echo "::error::查询标签 $tag 失败（HTTP $code）"
            cat /tmp/tag_commit.json || true
            exit 1
            ;;
          esac

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # 标签不存在时，明确创建在「本次构建的提交」上，而不是仓库默认分支的最新提交
          target_commitish: ${{ github.sha }}
          name: BG3 MOD 汉化工具 ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
          body: |
            ## 下载哪个

            | 文件 | 说明 |
            | --- | --- |
            | `*-Portable.zip` | **推荐**。解压后直接运行 `bg3-translate.exe`，配置与术语表放在 exe 同级 `config/`，随包携带、方便备份 |
            | `*-Setup.exe` | NSIS 安装程序（简体中文界面，可选择为当前用户或所有用户安装） |
            | `*-Installer.msi` | MSI 安装包（适合企业批量分发） |

            `SHA256SUMS.txt` 是各产物的 SHA-256 校验和。

            ## 平台说明

            只提供 **Windows x64**。这个工具的使用场景是「在 Windows 上翻译 MOD，
            然后在 Windows 上玩 BG3」，所以不再构建 macOS/Linux 产物。

            ## 首次使用

            1. 打开软件，选择 `.pak` 或 `.zip`
            2. 在设置里填大模型接口（OpenAI 兼容协议，默认 DeepSeek）
            3. 选中要翻译的文件，开始翻译
            4. 检查几条重点文本后重新打包

            详见仓库 README。
          files: release-assets/**/*
          fail_on_unmatched_files: true
