name: CI

# 三个并行任务：
#   meta          —— 版本号是否三处一致（几秒）
#   core           —— 纯逻辑核心库：fmt / clippy / 单元测试 + 端到端 PAK 闭环
#   web            —— 前端：单测 / 类型检查 / 构建，并把 dist 作为制品上传
#   tauri-shell    —— Windows 上编译 Tauri 壳（复用 web 的 dist 制品）
#
# 核心库刻意不依赖任何 GUI 系统库，所以能跑在 ubuntu-latest 上，几十秒出结果。

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验 package.json / Cargo.toml / tauri.conf.json 版本一致
        run: |
          set -euo pipefail
          pkg=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          tauri=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          ws=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml | head -n1)
          echo "package.json      = $pkg"
          echo "tauri.conf.json   = $tauri"
          echo "Cargo.toml(ws)    = $ws"
          if [ "$pkg" != "$tauri" ] || [ "$pkg" != "$ws" ]; then
            echo "::error::三处版本号不一致，请同步更新"
            exit 1
          fi

  core:
    name: 核心库（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          # workspace 只有一个 target 目录，key 里带上包名避免互相污染
          key: core

      - name: 代码格式
        run: cargo fmt --all --check

      - name: Clippy（零告警）
        run: cargo clippy -p bg3-translate-core --all-targets -- -D warnings

      - name: 单元测试 + 端到端闭环
        run: cargo test -p bg3-translate-core --all-targets

  web:
    name: 前端（test / typecheck / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 单元测试
        run: bun run test

      - name: 构建（含 tsc 类型检查）
        run: bun run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  tauri-shell:
    name: Tauri 壳编译检查（Windows）
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          key: shell-windows

      - name: 安装前端依赖
        run: bun install --frozen-lockfile

      - name: 取回前端产物（tauri 需要 frontendDist 已存在）
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - name: cargo check
        run: cargo check -p bg3-translate --all-targets

      - name: Clippy（零告警）
        run: cargo clippy -p bg3-translate --all-targets -- -D warnings
