[package]
name = "bg3-translate-core"
description = "BG3 MOD 汉化工具的核心逻辑：PAK 解包/打包、XML/LSX/LOCA 互转、术语表匹配、LLM 翻译引擎"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
regex.workspace = true
aho-corasick.workspace = true
quick-xml.workspace = true
zip.workspace = true
bg3rustpaklib.workspace = true
tokio.workspace = true
futures-util.workspace = true
directories.workspace = true

# TLS 后端按平台选择：
# - Windows：走系统 schannel（native-tls），零额外原生依赖，CI 最省事
# - 其他平台：走 rustls，避免依赖系统 OpenSSL（本地开发/测试可直接编译）
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.5", features = ["json", "stream", "http2"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "http2",
    "rustls",
] }

[dev-dependencies]
tempfile.workspace = true
bg3rustpaklib.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
